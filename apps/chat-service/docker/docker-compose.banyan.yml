version: "3.8"

# Each banyan service node is paired with a Gluetun WireGuard sidecar that
# tunnels all of its egress traffic through Mullvad VPN. Every container gets
# a distinct public-looking egress IP from a different Mullvad relay, while
# preserving consumer-grade NAT (no inbound public-internet ports) — matching
# the network conditions real residential / mobile users have.
#
# Required env vars per node (see ./.env, populated by
# test-utils/mullvad/provision-mullvad.sh):
#   MULLVAD_PRIVKEY_<NAME>      - WireGuard private key (base64)
#   MULLVAD_ADDR_<NAME>         - tunnel address (e.g. 10.66.x.y/32)
#   MULLVAD_HOSTNAME_<NAME>     - pinned relay hostname (e.g. us-nyc-wg-001)
#
# Each banyan node lives in its sidecar's network namespace via
# `network_mode: "service:vpn-<name>"` — it has no IP of its own and all
# traffic (including the libp2p listener) flows through the WireGuard tunnel.
# Host-side libp2p ports are published on the *sidecar*, since the banyan
# container no longer owns its own networking stack.

x-gluetun: &gluetun
  image: qmcgaw/gluetun:latest
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "--tries=1", "--timeout=5", "-qO-", "http://ifconfig.me/ip"]
    interval: 15s
    timeout: 8s
    retries: 5
    start_period: 30s

x-gluetun-env: &gluetun-env
  VPN_SERVICE_PROVIDER: mullvad
  VPN_TYPE: wireguard
  HEALTH_VPN_DURATION_INITIAL: 30s
  # Mullvad filters ICMP "fragmentation needed", so Path-MTU discovery is
  # blackholed: short HTTP requests work but libp2p's larger handshake packets
  # (1281-1380B) get silently dropped and every dial stalls to timeout. Pin a
  # conservative tunnel MTU so nothing exceeds the real path MTU.
  WIREGUARD_MTU: 1280
  # Disable Gluetun's built-in DoT resolver (Cloudflare DoT can't always be
  # reached through Mullvad relays). Use Mullvad's plain-DNS resolver at
  # 10.64.0.1 inside the WireGuard tunnel.
  DOT: "off"
  DNS_ADDRESS: 10.64.0.1
  # Disable the DNS leak check / blocklist downloads, which try to reach
  # github.com over a still-converging tunnel and just spam warnings.
  BLOCK_MALICIOUS: "off"
  BLOCK_SURVEILLANCE: "off"
  BLOCK_ADS: "off"

x-service-node: &service-node
  image: banyan-node:latest
  restart: unless-stopped

services:
  vpn-static-1:
    <<: *gluetun
    container_name: vpn-static-1
    networks: [net-static-1]
    environment:
      <<: *gluetun-env
      WIREGUARD_PRIVATE_KEY: ${MULLVAD_PRIVKEY_STATIC_1}
      WIREGUARD_ADDRESSES: ${MULLVAD_ADDR_STATIC_1}
      SERVER_HOSTNAMES: ${MULLVAD_HOSTNAME_STATIC_1}
    ports:
      - "9001:9001"
  static-1:
    <<: *service-node
    container_name: chat-static-1
    network_mode: "service:vpn-static-1"
    depends_on:
      vpn-static-1:
        condition: service_healthy
    volumes:
      - ../topology/output/nodes/chat-static-1/node-identity.pem:/app/node-identity.pem:ro
      - ../topology/output/nodes/chat-static-1/services:/app/services:ro
      - ../topology/output/nodes/chat-static-1/addons:/app/addons:ro
      - ../topology/output/nodes/chat-static-1/figs:/app/figs:ro
      - ./node-bootstrap.json:/app/node-bootstrap.json:ro
      - data-static-1:/app/data
    command:
      - "-config=/app/node-bootstrap.json"
      - "-privkey=/app/node-identity.pem"
      - "-services-dir=/app/services"
      - "-addons-dir=/app/addons"
      - "-figs-dir=/app/figs"
      - "-data-dir=/app/data"
      - "-listen=/ip4/0.0.0.0/tcp/9001"
      - "-no-crypto"
      - "-allow-expired-figs"
      - "-allow-insecure-figs"
      - "-tunnel-enabled"
      - "-override-transport-restrictions"
      - "-nat-traversal"

  vpn-ledger-1:
    <<: *gluetun
    container_name: vpn-ledger-1
    networks: [net-ledger-1]
    environment:
      <<: *gluetun-env
      WIREGUARD_PRIVATE_KEY: ${MULLVAD_PRIVKEY_LEDGER_1}
      WIREGUARD_ADDRESSES: ${MULLVAD_ADDR_LEDGER_1}
      SERVER_HOSTNAMES: ${MULLVAD_HOSTNAME_LEDGER_1}
    ports:
      - "9003:9003"
  ledger-1:
    <<: *service-node
    container_name: chat-ledger-1
    network_mode: "service:vpn-ledger-1"
    depends_on:
      vpn-ledger-1:
        condition: service_healthy
    volumes:
      - ../topology/output/nodes/chat-ledger-1/node-identity.pem:/app/node-identity.pem:ro
      - ../topology/output/nodes/chat-ledger-1/services:/app/services:ro
      - ../topology/output/nodes/chat-ledger-1/addons:/app/addons:ro
      - ../topology/output/nodes/chat-ledger-1/figs:/app/figs:ro
      - ./node-bootstrap.json:/app/node-bootstrap.json:ro
      - data-ledger-1:/app/data
    command:
      - "-config=/app/node-bootstrap.json"
      - "-privkey=/app/node-identity.pem"
      - "-services-dir=/app/services"
      - "-addons-dir=/app/addons"
      - "-figs-dir=/app/figs"
      - "-data-dir=/app/data"
      - "-listen=/ip4/0.0.0.0/tcp/9003"
      - "-no-crypto"
      - "-allow-expired-figs"
      - "-allow-insecure-figs"
      - "-tunnel-enabled"
      - "-override-transport-restrictions"
      - "-nat-traversal"

  vpn-ledger-2:
    <<: *gluetun
    container_name: vpn-ledger-2
    networks: [net-ledger-2]
    environment:
      <<: *gluetun-env
      WIREGUARD_PRIVATE_KEY: ${MULLVAD_PRIVKEY_LEDGER_2}
      WIREGUARD_ADDRESSES: ${MULLVAD_ADDR_LEDGER_2}
      SERVER_HOSTNAMES: ${MULLVAD_HOSTNAME_LEDGER_2}
    ports:
      - "9004:9004"
  ledger-2:
    <<: *service-node
    container_name: chat-ledger-2
    network_mode: "service:vpn-ledger-2"
    depends_on:
      vpn-ledger-2:
        condition: service_healthy
    volumes:
      - ../topology/output/nodes/chat-ledger-2/node-identity.pem:/app/node-identity.pem:ro
      - ../topology/output/nodes/chat-ledger-2/services:/app/services:ro
      - ../topology/output/nodes/chat-ledger-2/addons:/app/addons:ro
      - ../topology/output/nodes/chat-ledger-2/figs:/app/figs:ro
      - ./node-bootstrap.json:/app/node-bootstrap.json:ro
      - data-ledger-2:/app/data
    command:
      - "-config=/app/node-bootstrap.json"
      - "-privkey=/app/node-identity.pem"
      - "-services-dir=/app/services"
      - "-addons-dir=/app/addons"
      - "-figs-dir=/app/figs"
      - "-data-dir=/app/data"
      - "-listen=/ip4/0.0.0.0/tcp/9004"
      - "-no-crypto"
      - "-allow-expired-figs"
      - "-allow-insecure-figs"
      - "-tunnel-enabled"
      - "-override-transport-restrictions"
      - "-nat-traversal"

  vpn-mod-1:
    <<: *gluetun
    container_name: vpn-mod-1
    networks: [net-mod-1]
    environment:
      <<: *gluetun-env
      WIREGUARD_PRIVATE_KEY: ${MULLVAD_PRIVKEY_MOD_1}
      WIREGUARD_ADDRESSES: ${MULLVAD_ADDR_MOD_1}
      SERVER_HOSTNAMES: ${MULLVAD_HOSTNAME_MOD_1}
    ports:
      - "9005:9005"
  mod-1:
    <<: *service-node
    container_name: chat-mod-1
    network_mode: "service:vpn-mod-1"
    depends_on:
      vpn-mod-1:
        condition: service_healthy
    volumes:
      - ../topology/output/nodes/chat-mod-1/node-identity.pem:/app/node-identity.pem:ro
      - ../topology/output/nodes/chat-mod-1/services:/app/services:ro
      - ../topology/output/nodes/chat-mod-1/addons:/app/addons:ro
      - ../topology/output/nodes/chat-mod-1/figs:/app/figs:ro
      - ./node-bootstrap.json:/app/node-bootstrap.json:ro
      - data-mod-1:/app/data
    command:
      - "-config=/app/node-bootstrap.json"
      - "-privkey=/app/node-identity.pem"
      - "-services-dir=/app/services"
      - "-addons-dir=/app/addons"
      - "-figs-dir=/app/figs"
      - "-data-dir=/app/data"
      - "-listen=/ip4/0.0.0.0/tcp/9005"
      - "-no-crypto"
      - "-allow-expired-figs"
      - "-allow-insecure-figs"
      - "-tunnel-enabled"
      - "-override-transport-restrictions"
      - "-nat-traversal"

  vpn-admin-1:
    <<: *gluetun
    container_name: vpn-admin-1
    networks: [net-admin-1]
    environment:
      <<: *gluetun-env
      WIREGUARD_PRIVATE_KEY: ${MULLVAD_PRIVKEY_ADMIN_1}
      WIREGUARD_ADDRESSES: ${MULLVAD_ADDR_ADMIN_1}
      SERVER_HOSTNAMES: ${MULLVAD_HOSTNAME_ADMIN_1}
    ports:
      - "9006:9006"
  admin-1:
    <<: *service-node
    container_name: chat-admin-1
    network_mode: "service:vpn-admin-1"
    depends_on:
      vpn-admin-1:
        condition: service_healthy
    volumes:
      - ../topology/output/nodes/chat-admin-1/node-identity.pem:/app/node-identity.pem:ro
      - ../topology/output/nodes/chat-admin-1/services:/app/services:ro
      - ../topology/output/nodes/chat-admin-1/addons:/app/addons:ro
      - ../topology/output/nodes/chat-admin-1/figs:/app/figs:ro
      - ./node-bootstrap.json:/app/node-bootstrap.json:ro
      - data-admin-1:/app/data
    command:
      - "-config=/app/node-bootstrap.json"
      - "-privkey=/app/node-identity.pem"
      - "-services-dir=/app/services"
      - "-addons-dir=/app/addons"
      - "-figs-dir=/app/figs"
      - "-data-dir=/app/data"
      - "-listen=/ip4/0.0.0.0/tcp/9006"
      - "-no-crypto"
      - "-allow-expired-figs"
      - "-allow-insecure-figs"
      - "-tunnel-enabled"
      - "-override-transport-restrictions"
      - "-nat-traversal"

# Each VPN sidecar lives on its own dedicated bridge network so that the
# only path between containers is through the public internet via their
# respective Mullvad WireGuard tunnels — matching real-world deployment.
networks:
  net-static-1: { driver: bridge }
  net-ledger-1: { driver: bridge }
  net-ledger-2: { driver: bridge }
  net-mod-1:    { driver: bridge }
  net-admin-1:  { driver: bridge }

# Per-node writable volumes hold the durable persistence tree
# (/app/data/peerstore.db), so warm-dial state survives `docker compose
# down/up`. All other node mounts are read-only generated topology.
volumes:
  data-static-1: {}
  data-ledger-1: {}
  data-ledger-2: {}
  data-mod-1:    {}
  data-admin-1:  {}

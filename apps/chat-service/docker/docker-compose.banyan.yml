      - "-services-dir=/app/services"
      - "-addons-dir=/app/addons"
      - "-figs-dir=/app/figs"
      - "-listen=/ip4/0.0.0.0/tcp/9002"
      - "-no-crypto"
      - "-allow-expired-figs"
      - "-allow-insecure-figs"
      - "-tunnel-enabled"
      - "-override-transport-restrictions"

  ledger-1:

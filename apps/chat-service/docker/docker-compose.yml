version: "3.8"

services:
  static-1:
    build:
      context: ../..
      dockerfile: apps/chat-service/docker/Dockerfile.static
    image: banyan-chat-static:latest
    container_name: chat-static-1
    hostname: static-1
    ports:
      - "8081:8080"
    volumes:
      - static-1-data:/app/data
      - ../topology/output/keys:/app/keys:ro
    environment:
      - NODE_TYPE=static
      - LISTEN_ADDR=:8080
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ledger-1:
    build:
      context: ../..
      dockerfile: apps/chat-service/docker/Dockerfile.ledger
    image: banyan-chat-ledger:latest
    container_name: chat-ledger-1
    hostname: ledger-1
    ports:
      - "8082:8080"
    volumes:
      - ledger-1-data:/app/data
      - ../topology/output/keys:/app/keys:ro
    environment:
      - NODE_TYPE=ledger
      - LISTEN_ADDR=:8080
      - SYNC_PEERS=http://ledger-2:8080/ledger/sync
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - static-1

  ledger-2:
    build:
      context: ../..
      dockerfile: apps/chat-service/docker/Dockerfile.ledger
    image: banyan-chat-ledger:latest
    container_name: chat-ledger-2
    hostname: ledger-2
    ports:
      - "8083:8080"
    volumes:
      - ledger-2-data:/app/data
      - ../topology/output/keys:/app/keys:ro
    environment:
      - NODE_TYPE=ledger
      - LISTEN_ADDR=:8080
      - SYNC_PEERS=http://ledger-1:8080/ledger/sync
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - static-1

  mod-1:
    build:
      context: ../..
      dockerfile: apps/chat-service/docker/Dockerfile.mod
    image: banyan-chat-mod:latest
    container_name: chat-mod-1
    hostname: mod-1
    ports:
      - "8084:8080"
    volumes:
      - mod-1-data:/app/data
      - ../topology/output/keys:/app/keys:ro
    environment:
      - NODE_TYPE=mod
      - LISTEN_ADDR=:8080
      - SYNC_PEERS=http://ledger-1:8080/ledger/sync,http://ledger-2:8080/ledger/sync
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - ledger-1
      - ledger-2

  admin-1:
    build:
      context: ../..
      dockerfile: apps/chat-service/docker/Dockerfile.admin
    image: banyan-chat-admin:latest
    container_name: chat-admin-1
    hostname: admin-1
    ports:
      - "8085:8080"
    volumes:
      - admin-1-data:/app/data
      - ../topology/output/keys:/app/keys:ro
    environment:
      - NODE_TYPE=admin
      - LISTEN_ADDR=:8080
      - SYNC_PEERS=http://ledger-1:8080/ledger/sync,http://ledger-2:8080/ledger/sync
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - ledger-1
      - ledger-2

networks:
  chat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  static-1-data:
  ledger-1-data:
  ledger-2-data:
  mod-1-data:
  admin-1-data:
